name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/super-protocol/swarm-doc-ingest/ingest

jobs:
  release:
    name: Build, push, attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # `attestations: write` and `id-token: write` are what make the digest
      # traceable: scripts/verify-pins/ in swarm-marketplace-catalog verifies
      # `gh attestation verify oci://<image>@<digest> --repo
      # Super-Protocol/swarm-doc-ingest`, and that check is the only statement
      # about where these bytes came from that this workflow cannot forge.
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${version}"

      - name: Refuse to overwrite a published tag
        # An immutable tag is the whole point: a listing pins a digest and names
        # the tag that says which release it is. Re-pushing a tag onto fresh
        # bytes is how a tag stops identifying one image (SUP-316).
        run: |
          if docker manifest inspect "${IMAGE}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.version.outputs.version }} already exists. Bump the version."
            exit 1
          fi

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: swarm-doc-ingest:candidate
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test before anything is published
        # A render test and a readiness probe both pass on a build that extracts
        # nothing, which is the lesson SUP-839 recorded about vLLM: nine
        # releases started, passed a health check and returned fluent nonsense.
        # So the gate on publishing is a real document through a real container.
        run: ./scripts/smoke.sh swarm-doc-ingest:candidate

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: What to pin
        run: |
          {
            echo "## Pin this in \`swarm-marketplace-catalog\`"
            echo
            echo '```yaml'
            echo "image:"
            echo "  repository: super-protocol/swarm-doc-ingest/ingest"
            echo "  tag: \"${{ steps.version.outputs.version }}\""
            echo "  digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Verify: \`gh attestation verify oci://${IMAGE}@${{ steps.push.outputs.digest }} --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
