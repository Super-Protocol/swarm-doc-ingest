name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install, with torch from the CPU index
        # The same index the image uses. The default wheel would pull sixteen
        # NVIDIA proprietary CUDA packages, and a CI job that installed them
        # would be testing a different dependency tree from the one we ship.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.0+cpu" "torchvision==0.29.2+cpu"
          pip install -e '.[test]'
      - name: Tests
        # No model weights needed: the mapping is tested against a document
        # built by hand, which is also the only way to assert a specific table
        # at a specific bounding box.
        run: pytest -q

  licences:
    name: Licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.0+cpu" "torchvision==0.29.2+cpu"
          pip install -e .
      - name: No copyleft or unidentified licence in what we ship
        # This is the gate that notices if the CPU index above is ever dropped.
        run: python scripts/collect-licences.py "${RUNNER_TEMP}/licenses"
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licences
          path: ${{ runner.temp }}/licenses/THIRD_PARTY.md

  image:
    name: Image build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reclaim runner disk
        # The image is ~3 GiB: a 1.8 GiB runtime plus 536 MiB of baked models
        # plus the base. A hosted runner has about 14 GiB free before this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: swarm-doc-ingest:ci
          build-args: |
            VERSION=0.0.0-ci
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: ./scripts/smoke.sh swarm-doc-ingest:ci
